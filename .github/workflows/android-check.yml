name: Android native bridge regression
on:
  push:
    paths: ['project.zip', '*project.zip', '*BridgeRegression.java', '.github/workflows/*android-check*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare build
        run: |
          unzip -q "$(ls 3-1-project.zip | head -1)" -d project
          cp 4-2-BridgeRegression.java project/src/site/federicotaranu/nova/BridgeRegression.java
          python3 - <<'PY'
          p='project/src/site/federicotaranu/nova/MainActivity.java'
          s=open(p).read().replace('getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,WindowManager.LayoutParams.FLAG_SECURE);','')
          open(p,'w').write(s)
          p='project/AndroidManifest.xml'
          s=open(p).read().replace('</manifest>','<instrumentation android:name=".BridgeRegression" android:targetPackage="site.federicotaranu.nova"/></manifest>')
          open(p,'w').write(s)
          PY
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          keytool -genkeypair -keystore /tmp/test.p12 -storepass synthetic-password -alias nova -dname CN=Synthetic -keyalg RSA -validity 2
          printf '%s' synthetic-password >/tmp/test-pass
          cd project
          ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME NOVA_COMPILE_PLATFORM=android-35 NOVA_KEYSTORE=/tmp/test.p12 NOVA_KEYPASS_FILE=/tmp/test-pass bash build.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p evidence
            adb install project/build/NOVA-2026.10.24.android.4-test.apk
            timeout 220s adb shell am instrument -w site.federicotaranu.nova/.BridgeRegression | tee evidence/result.txt
            adb root
            adb wait-for-device
            adb pull /sdcard/Android/data/site.federicotaranu.nova/files/native.png evidence/android-native.png
            adb pull /sdcard/Android/data/site.federicotaranu.nova/files/keyboard.png evidence/keyboard.png
            grep 'RESULT_OK\|INSTRUMENTATION_CODE: -1' evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-evidence
          path: evidence/
          retention-days: 1
