name: Android home widget verification
on:
  push:
    paths: ['1-WidgetRegression.java', '.github/workflows/*widget-check*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare build
        run: |
          unzip -q "$(ls 2-project6.zip | head -1)" -d project
          cp 1-WidgetRegression.java project/src/site/federicotaranu/nova/WidgetRegression.java
          python3 - <<'PY'
          p='project/src/site/federicotaranu/nova/MainActivity.java'
          s=open(p).read().replace('getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,WindowManager.LayoutParams.FLAG_SECURE);','')
          open(p,'w').write(s)
          p='project/AndroidManifest.xml'
          s=open(p).read().replace('</manifest>','<instrumentation android:name=".WidgetRegression" android:targetPackage="site.federicotaranu.nova"/></manifest>')
          open(p,'w').write(s)
          PY
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          keytool -genkeypair -keystore /tmp/test.p12 -storepass synthetic-password -alias nova -dname CN=Synthetic -keyalg RSA -validity 2
          printf '%s' synthetic-password >/tmp/test-pass
          cd project
          ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME NOVA_COMPILE_PLATFORM=android-35 NOVA_KEYSTORE=/tmp/test.p12 NOVA_KEYPASS_FILE=/tmp/test-pass bash build.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            mkdir -p evidence
            adb install project/build/NOVA-2026.10.24.android.6-test.apk
            timeout 120s adb shell am instrument -w site.federicotaranu.nova/.WidgetRegression | tee evidence/result.txt
            adb root
            adb wait-for-device
            adb pull /sdcard/Android/data/site.federicotaranu.nova/files/ evidence/ || true
            adb shell dumpsys appwidget >evidence/appwidget.txt
            grep 'INSTRUMENTATION_CODE: -1' evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-evidence-${{ matrix.api }}
          path: evidence/
          retention-days: 1
